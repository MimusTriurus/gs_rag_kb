<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DPS helper</title>
    <style>
        body {
            height: 97vh;
            background-color: #1e1e1e;
            color: #cfcfcf;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #chat-box {
            width: 80%;
            height: auto;
            flex: 1 1 auto;
            background: #2e2e2e;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #4a90e2 #2e2e2e;
        }

        #chat-box::-webkit-scrollbar {
            width: 8px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: #2e2e2e;
            border-radius: 5px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: #4a90e2;
            border-radius: 5px;
            border: 2px solid #2e2e2e;
        }

        #chat-box::-webkit-scrollbar-thumb:hover {
            background-color: #3a7ac2;
        }

        .message {
            max-width: 60%;
            margin: 5px;
            padding: 10px;
            border-radius: 10px;
            position: relative;
        }

        .user {
            align-self: flex-end;
            background-color: #4a90e2;
            color: white;
            border-bottom-right-radius: 0;
        }

        .bot {
            align-self: flex-start;
            background-color: #3e3e3e;
            color: #fff;
            border-bottom-left-radius: 0;
        }

        #input-box {
            width: 80%;
            display: flex;
        }

        #input-box input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #3e3e3e;
            color: #fff;
        }

        button {
            margin-left: 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dislike_btn {
            background-color: darkred;
        }

        a {
            color: #4a90e2;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 4px solid #555;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            flex: none;
            align-self: center;
        }

        @keyframes spin {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }

        button.active-like {
            background-color: #45a049 !important;
            border: 2px solid white;
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        .dislike_btn.active-dislike {
            background-color: #8b0000 !important;
            border: 2px solid white;
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.5);
        }

        #side-menu {
            border-right: solid 2px #4caf50;
            position: fixed;
            top: 0;
            left: -550px;
            width: 500px;
            height: 100%;
            background-color: #2e2e2e;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 998;
        }

        #side-menu label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            text-align: left;
        }

        #side-menu input {
            margin-bottom: 10px;
            padding: 8px;
            background: #3e3e3e;
            border: none;
            border-radius: 4px;
            color: white;
        }

        #menu-toggle {
            position: fixed;
            bottom: 10px;
            left: 5px;
            z-index: 999;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #4caf50;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        #side-menu.show {
            left: 0;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<button id="menu-toggle">☰</button>
<div id="side-menu">
    <label for="LLM_MODEL">LLM model</label>
    <input id="LLM_MODEL" placeholder="LLM_MODEL" value="mistral-nemo:12b">

    <label for="LLM_CREATIVITY">LLM's creativity in responding (0.0-1.0).</label>
    <input id="LLM_CREATIVITY" type="number" step="0.1" min="0.0" max="1.0" placeholder="LLM_CREATIVITY" value="0.1">

    <label for="QUESTION_REFINER_CREATIVITY">LLM's question refiner creativity (0.0-1.0).</label>
    <input id="QUESTION_REFINER_CREATIVITY" type="number" step="0.1" min="0.0" max="1.0" placeholder="QUESTION_REFINER_CREATIVITY" value="0.1">

    <label for="TOP_K_FILE_SELECT">Top N file to select from the knowledge base (1-5).</label>
    <input id="TOP_K_FILE_SELECT" type="number" step="1" min="1" max="5" placeholder="TOP_K_FILE_SELECT" value="3">

    <label for="THRESHOLD_FILE_SELECT">Threshold for the file selection from the knowledge base (0.3-0.99).</label>
    <input id="THRESHOLD_FILE_SELECT" type="number" step="0.01" min="0.3" max="0.99" placeholder="THRESHOLD_FILE_SELECT" value="0.8">

    <label for="NEED_2_REFINE_QUERY_USING_HISTORY">Refine the user's query using history if it's not obvious.</label>
    <input type="checkbox" id="NEED_2_REFINE_QUERY_USING_HISTORY" checked>

    <label for="HISTORY_LENGTH">Count of messages in the history (2-10).</label>
    <input id="HISTORY_LENGTH" type="number" step="1" min="2" max="10" placeholder="HISTORY_LENGTH" value="2">

    <label for="THRESHOLD_CHUNKS_RETRIEVE">Threshold to search for information in the document (0.3-0.99).</label>
    <input id="THRESHOLD_CHUNKS_RETRIEVE" type="number" step="0.01" min="0.3" max="0.99" placeholder="THRESHOLD_CHUNKS_RETRIEVE" value="0.7">

    <label for="TOP_K_RETRIEVAL">Maximum amount of chunks from the document for searching (50-100).</label>
    <input id="TOP_K_RETRIEVAL" type="number" step="1" min="50" max="100" placeholder="TOP_K_RETRIEVAL" value="50">

    <label for="TOP_K_RERANK">Maximum amount of chunks from the document for processing (5-10).</label>
    <input id="TOP_K_RERANK" type="number" step="1" min="5" max="10" placeholder="TOP_K_RERANK" value="5">

    <label for="NEED_2_REFINE_QUERY">Need to modify a base user request.</label>
    <input type="checkbox" id="NEED_2_REFINE_QUERY">

    <label for="GENERATE_QUESTIONS">Generate possible questions for the provided context.</label>
    <input type="checkbox" checked id="GENERATE_QUESTIONS">
</div>

<h1>DPS Assistant</h1>
<div id="chat-box">
</div>
<div id="input-box">
    <input type="text" id="user-input" placeholder="Ask something..." autocomplete="off"/>
    <button onclick="sendQuery()" id="send-btn">Send</button>
</div>
<script>
    function getSettings() {
        return {
            LLM_MODEL: document.getElementById('LLM_MODEL').value,
            LLM_CREATIVITY: document.getElementById('LLM_CREATIVITY').value,
            TOP_K_RETRIEVAL: document.getElementById('TOP_K_RETRIEVAL').value,
            TOP_K_RERANK: document.getElementById('TOP_K_RERANK').value,
            TOP_K_FILE_SELECT: document.getElementById('TOP_K_FILE_SELECT').value,
            THRESHOLD_FILE_SELECT: document.getElementById('THRESHOLD_FILE_SELECT').value,
            THRESHOLD_CHUNKS_RETRIEVE: document.getElementById('THRESHOLD_CHUNKS_RETRIEVE').value,
            NEED_2_REFINE_QUERY_USING_HISTORY: document.getElementById('NEED_2_REFINE_QUERY_USING_HISTORY').value,
            QUESTION_REFINER_CREATIVITY: document.getElementById('QUESTION_REFINER_CREATIVITY').value,
            NEED_2_REFINE_QUERY: document.getElementById('NEED_2_REFINE_QUERY').value,
            HISTORY_LENGTH: document.getElementById('HISTORY_LENGTH').value,
            GENERATE_QUESTIONS: document.getElementById('GENERATE_QUESTIONS').value
        };
    }

    const menuToggleBtn = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('side-menu');

    menuToggleBtn.addEventListener('click', function () {
        sideMenu.classList.toggle('show');
        menuToggleBtn.innerText = sideMenu.classList.contains('show') ? '☰' : '☰';
    });

    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');

    function stripHtml(html) {
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = html;
        return tempDiv.textContent || tempDiv.innerText || "";
    }


    async function sendQuery() {
        const input = document.getElementById('user-input');
        const query = input.value.trim();
        if (!query) return;
        const userMsg = document.createElement('div');
        userMsg.className = 'message user';
        userMsg.textContent = query;
        chatBox.appendChild(userMsg);

        input.value = '';
        sendBtn.disabled = true;
        sendBtn.style.backgroundColor = '#888';
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        chatBox.appendChild(spinner);
        chatBox.scrollTo({top: chatBox.scrollHeight, behavior: 'smooth'});
        console.log(query)
        let q = {
            'query': query,
            'settings': getSettings()
        }
        console.log(JSON.stringify(q))
        const res = await fetch('/rag/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(q)
        });
        const data = await res.json();
        spinner.remove();
        sendBtn.disabled = false;
        sendBtn.style.backgroundColor = '#4caf50';
        const botMsg = document.createElement('div');
        botMsg.className = 'message bot';
        console.log(stripHtml(data.answer));
        if (data.author === '' && data.url === '') {
            botMsg.innerHTML = `${data.answer}<br/>`
        } else {
            botMsg.innerHTML = `${data.answer}<br/>
                    <a href="${data.url}">Document link</a><br/><br/>
                    <b>${data.author}</b><br/><br/>
                    <button onclick="handleFeedback(event, '${query}', true, '')">👍</button>
                    <button class="dislike_btn" onclick="handleFeedback(event, '${query}', false, '')">👎</button>
                    `;
        }
        chatBox.appendChild(botMsg);
    }

    function handleFeedback(event, query, liked, answer) {
        event.preventDefault();
        const btn = event.target;
        const container = btn.closest('.message');
        console.log(answer)
        container.querySelectorAll('button').forEach(b => {
            b.classList.remove('active-like', 'active-dislike');
        });

        if (!btn.classList.contains(liked ? 'active-like' : 'active-dislike')) {
            btn.classList.add(liked ? 'active-like' : 'active-dislike');
            sendFeedback(query, liked, answer);
        } else {
            sendFeedback(query, null, answer);
        }
    }

    async function sendFeedback(query, liked, answer) {
        let content = JSON.stringify({query, liked, answer});
        console.log(content)
        await fetch('/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: content});
    }

    document.getElementById('user-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendQuery();
        }
    });

    $( document ).ready(function() {

    });
</script>
</body>
</html>
